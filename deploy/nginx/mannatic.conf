# Configurazione Nginx per Mannatic / Climatrend
# Posizione consigliata sul server: /etc/nginx/sites-available/mannatic.conf
#
# Per attivare il sito:
# sudo ln -s /etc/nginx/sites-available/mannatic.conf /etc/nginx/sites-enabled/
# sudo nginx -t
# sudo systemctl reload nginx

# Reindirizzamento HTTP verso HTTPS (verrà gestito anche in automatico da certbot)
server {
    listen 80;
    listen [::]:80;
    server_name app.tuodominio.it; # <-- Inserisci qui il tuo dominio / sottodominio

    # Dimensione massima per caricamento allegati/foto (50 MB)
    client_max_body_size 50M;

    location / {
        # Porta configurata nel docker-compose.yml (8001)
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;

        # Supporto WebSockets e Server-Sent Events
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Header standard per inoltro IP e Host corretti a Next.js
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout per operazioni lunghe o upload
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_cache_bypass $http_upgrade;
    }
}
